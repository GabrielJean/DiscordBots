name: Build and Push Jokebot to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'jokebot/**'
      - '.github/workflows/jokebot.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read version from file
        id: version
        shell: bash
        run: |
          VERSION=$(cat jokebot/VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "Error: jokebot/VERSION file is empty!" >&2
            exit 1
          fi
          IMAGE="ghcr.io/${{ github.repository_owner }}/jokebot:${VERSION}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "Building image: ${IMAGE,,}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./jokebot
          file: ./jokebot/Dockerfile
          push: true
          tags: ${{ steps.version.outputs.image }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup untagged images
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'jokebot'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
