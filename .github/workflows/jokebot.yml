name: Build and Push Jokebot to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'jokebot/**'
      - '.github/workflows/jokebot.yml'
    tags:
      - 'jokebot/v*'
      - 'jokebot-v*'
      - 'jokebot/*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/jokebot
          tags: |
            type=match,pattern=jokebot[/-]v?(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/jokebot') || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./jokebot
          file: ./jokebot/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
