name: Build and Push Musicbot to GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'musicbot/**'
      - '.github/workflows/musicbot.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read version from file
        id: version
        shell: bash
        run: |
          VERSION=$(cat musicbot/VERSION | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "Error: musicbot/VERSION file is empty!" >&2
            exit 1
          fi
          IMAGE="ghcr.io/${{ github.repository_owner }}/musicbot:${VERSION}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "Building image: ${IMAGE,,}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./musicbot
          file: ./musicbot/Dockerfile
          push: true
          tags: ${{ steps.version.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
